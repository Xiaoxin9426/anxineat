server:
  port: 8080

spring:
  application:
    name: anxineat-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/anxineat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    # 不启用全局逻辑删除：多数表的 status 是业务语义（上架/下架、营业/休息），
    # 而非删除标记，全局开启会造成「下架商品查不到」这类隐蔽问题。
    # 需要软删除的地方在业务代码里显式处理。
    db-config:
      id-type: auto

anxineat:
  # JWT 配置。生产环境必须通过环境变量注入，不要使用默认值。
  jwt:
    secret: ${JWT_SECRET:anxineat-dev-secret-please-change-in-production-environment-0123456789}
    user-ttl-hours: 720      # 用户登录态有效期（30 天）
    admin-ttl-hours: 12      # 后台登录态有效期
  # 微信小程序登录（真实 wx.login → code2Session 换 openid）
  # 配置 app-id/app-secret 后，/auth/login 走真实登录；留空则仅支持 mock: 前缀的本地联调 code
  wx:
    miniapp:
      app-id: ${WX_MINIAPP_APPID:}
      app-secret: ${WX_MINIAPP_SECRET:}
  pay:
    # MOCK = 模拟支付（默认，本地可跑通全链路）
    # WECHAT_JSAPI = 真实微信支付 V3，需要配置下方商户参数后才可启用
    channel: ${PAY_CHANNEL:MOCK}
    wechat:
      enabled: false
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      mch-serial-no: ${WECHAT_MCH_SERIAL_NO:}
      private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
      notify-url: ${WECHAT_NOTIFY_URL:}
  # 开发模式：手机号登录验证码固定为 1234（并写入日志），无需短信服务
  dev-mode: true

logging:
  level:
    root: INFO
    com.anxineat: DEBUG
    org.springframework.web: INFO
